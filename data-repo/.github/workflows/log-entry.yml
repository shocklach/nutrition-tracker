name: Log entry
run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
      && format('Log entry manual-{0}', github.run_id)
      || format('Log entry {0}', github.event.client_payload.entryId) }}

# Triggered by the Custom GPT via:
#   POST /repos/{owner}/{repo}/dispatches
#   { "event_type": "log-entry", "client_payload": { ...macros... } }
on:
  repository_dispatch:
    types: [log-entry]

  # Same job, driven by hand from the Actions tab. Useful for verifying the
  # backend without involving ChatGPT, and for logging a meal from a browser.
  workflow_dispatch:
    inputs:
      proteinGrams:
        description: Protein (g)
        required: true
      calories:
        description: Calories
        required: true
      saturatedFatGrams:
        description: Saturated fat (g)
        required: true
      fiberGrams:
        description: Fiber (g)
        required: true
      note:
        description: What was it?
        required: false
      dateKey:
        description: Backdate to YYYY-MM-DD (blank = today, US Central)
        required: false

permissions:
  contents: write

# Serialize runs so two meals logged seconds apart cannot race each other.
# Never cancel in progress — a cancelled run is a lost meal.
concurrency:
  group: log-entry
  cancel-in-progress: false

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Append entry and push
        env:
          # Passed through the environment rather than interpolated into the
          # script: client_payload is attacker-controllable text.
          PAYLOAD: >-
            ${{ github.event_name == 'workflow_dispatch'
                && toJSON(github.event.inputs)
                || toJSON(github.event.client_payload) }}
          BRANCH: ${{ github.event.repository.default_branch }}
          # ChatGPT supplies a stable ID. Manual runs use their GitHub run ID.
          ENTRY_ID: >-
            ${{ github.event_name == 'workflow_dispatch'
                && format('manual-{0}', github.run_id)
                || github.event.client_payload.entryId }}
          # repository_dispatch (ChatGPT) or workflow_dispatch (manual).
          TRIGGER: ${{ github.event_name }}
        run: |
          set -euo pipefail

          git config user.name "nutrition-log"
          git config user.email "nutrition-log@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            # Rebuild on top of whatever is current — the app writes to this same
            # file over the Contents API, so our base can go stale mid-run.
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"

            node scripts/append-entry.mjs

            git add entries.json
            if git diff --cached --quiet; then
              echo "Nothing to commit."
              exit 0
            fi

            git commit -m "Log meal ($TRIGGER)"

            if git push origin "HEAD:$BRANCH"; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi

            echo "Push rejected, retrying..."
            sleep $(( attempt * 2 ))
          done

          echo "Could not push after 5 attempts." >&2
          exit 1
